<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8ee">
<meta name="robots" content="noindex">
<title>블록스 놀이터</title>
<style>
  :root{
    --cream:#fff8ee; --cream2:#ffefdc; --ink:#2f2417; --ink2:#6d5c47; --ink3:#a08c72;
    --line:#f0e2cd; --card:#fffdf9;
    --r:26px; --shadow:0 6px 0 rgba(47,36,23,.06), 0 12px 26px rgba(47,36,23,.08);
    -webkit-text-size-adjust:100%;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
    font-size:17px;line-height:1.45;letter-spacing:-.2px;
    padding-bottom:env(safe-area-inset-bottom);
    overflow-wrap:anywhere;
  }
  body.lock{overflow:hidden}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ── 홈 ── */
  .home-top{padding:20px 0 6px}
  .logo{display:flex;align-items:center;gap:10px}
  .logo .blk{display:flex;gap:4px}
  .logo .blk i{width:16px;height:16px;border-radius:5px;display:block;animation:bob 1.6s ease-in-out infinite}
  .logo .blk i:nth-child(1){background:#ff5a5f}
  .logo .blk i:nth-child(2){background:#ffb020;animation-delay:.15s}
  .logo .blk i:nth-child(3){background:#3ec1a0;animation-delay:.3s}
  .logo .blk i:nth-child(4){background:#5b8def;animation-delay:.45s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-1px}
  .tagline{margin:6px 0 0;color:var(--ink2);font-size:15px;font-weight:700}
  .gemtop{position:fixed;right:14px;top:14px;z-index:30;display:flex;align-items:center;gap:6px;
    background:#fff;border:2px solid #ffe0a6;border-radius:999px;padding:7px 14px 7px 10px;
    box-shadow:0 4px 0 rgba(47,36,23,.06);font-weight:900;font-size:18px}
  .gemtop .g{font-size:21px}
  .gemtop.pop{animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 0 28px}
  .card{position:relative;border-radius:var(--r);padding:15px 14px 14px;text-align:left;
    box-shadow:var(--shadow);overflow:hidden;min-height:158px;display:flex;flex-direction:column;justify-content:space-between;
    transition:transform .12s ease}
  .card:active{transform:scale(.97)}
  .card .ic{display:block;font-size:46px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.08))}
  .card .nm{display:block;font-size:21px;font-weight:900;letter-spacing:-.6px;margin-top:8px}
  .card .sub{display:block;font-size:13px;font-weight:800;opacity:.85;margin-top:2px}
  .card .bar{display:block;height:9px;border-radius:999px;background:rgba(255,255,255,.55);margin-top:10px;overflow:hidden}
  .card .bar i{display:block;height:100%;border-radius:999px;background:#fff}
  .card .cnt{display:block;font-size:12.5px;font-weight:800;margin-top:6px;opacity:.9}
  .card .deco{position:absolute;right:-14px;top:-14px;width:76px;height:76px;border-radius:22px;background:rgba(255,255,255,.22);transform:rotate(14deg)}

  /* ── 시리즈(단계 길) ── */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(255,248,238,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(240,226,205,.8);padding:10px 0 10px}
  .topbar .row{display:flex;align-items:center;gap:10px}
  .back{width:46px;height:46px;border-radius:16px;background:#fff;box-shadow:0 3px 0 rgba(47,36,23,.07);
    font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .back:active{transform:translateY(2px)}
  .ttl{flex:1;min-width:0}
  .ttl b{display:block;font-size:20px;font-weight:900;letter-spacing:-.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttl span{display:block;font-size:12.5px;font-weight:800;color:var(--ink3)}
  .pill{display:inline-flex;align-items:center;gap:5px;background:#fff;border:2px solid #ffe0a6;border-radius:999px;
    padding:5px 11px;font-weight:900;font-size:15px}

  .hero{margin:14px 0 6px;border-radius:26px;padding:18px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .hero .k{font-size:13px;font-weight:900;opacity:.9}
  .hero .t{font-size:24px;font-weight:900;line-height:1.2;margin:6px 0 10px;letter-spacing:-.6px}
  .hero .go{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#2f2417;border-radius:999px;
    padding:12px 20px;font-weight:900;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
  .hero .deco2{position:absolute;right:-20px;bottom:-24px;font-size:110px;opacity:.18;transform:rotate(-12deg)}

  .pathlist{padding:6px 0 34px;position:relative}
  .step{display:flex;gap:12px;align-items:center;padding:7px 0;position:relative}
  .step .dot{flex:0 0 auto;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:19px;background:#fff;border:3px solid var(--line);color:var(--ink2);position:relative;z-index:1}
  .step .body{flex:1;min-width:0;background:#fff;border-radius:18px;padding:11px 14px;text-align:left;box-shadow:0 2px 0 rgba(47,36,23,.05);
    display:flex;align-items:center;gap:10px}
  .step .body .txt{flex:1;min-width:0}
  .step .body b{display:block;font-size:16.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .step .body small{display:block;font-size:12px;font-weight:700;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .step .body .nq{flex:0 0 auto;font-size:12px;font-weight:900;color:#9a7b4e;background:#fff5e3;border-radius:999px;padding:3px 9px}
  .step.done .dot{background:#fff;border-color:#ffd166;color:#a97b00}
  .step.next .dot{background:#2f2417;border-color:#2f2417;color:#fff;transform:scale(1.08)}
  .step.next .body{border:3px solid #ffcf6b;box-shadow:0 5px 0 rgba(255,183,58,.22)}
  .step.next .body b{font-size:18px}
  .step .line{position:absolute;left:26px;top:0;bottom:0;width:4px;background:#f3e5d0;border-radius:2px;z-index:0}
  .step:first-child .line{top:50%}
  .step:last-child .line{bottom:50%}
  .badge-now{display:inline-block;background:#ff5a5f;color:#fff;font-size:11px;font-weight:900;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}

  /* ── 플레이어 ── */
  .player{padding:12px 16px 28px}
  .video{position:relative;width:100%;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#241b12;box-shadow:var(--shadow)}
  .video iframe{width:100%;height:100%;border:0;display:block}
  .poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;
    background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.28),transparent 60%),linear-gradient(140deg,#7c5cff,#ff5a8a);}
  .poster .play{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.94);color:#2f2417;
    display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 8px 22px rgba(0,0,0,.3)}
  .poster b{font-size:17px;font-weight:900}
  .ephead{padding:16px 2px 4px}
  .ephead h2{margin:0;font-size:26px;font-weight:900;letter-spacing:-.8px;line-height:1.22}
  .ephead .meta{font-size:13px;font-weight:800;color:var(--ink3);margin-top:4px}
  .learnbox{margin-top:12px;background:#fff;border-radius:20px;padding:16px;box-shadow:0 3px 0 rgba(47,36,23,.05);
    font-size:16px;font-weight:700;color:var(--ink2);line-height:1.5}
  .learnbox .lt{font-size:12.5px;font-weight:900;color:#b0894f;margin-bottom:6px}
  .descbox{max-height:88px;overflow:hidden;transition:max-height .25s ease}
  .descbox.open{max-height:900px}
  .morebtn{margin-top:8px;font-size:13.5px;font-weight:900;color:#a2682f}
  .bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:16px;
    background:linear-gradient(135deg,#ffb020,#ff7a3d);color:#fff;border-radius:22px;padding:19px;font-size:21px;font-weight:900;
    box-shadow:0 6px 0 #d9601f;letter-spacing:-.4px}
  .bigbtn:active{transform:translateY(3px);box-shadow:0 3px 0 #d9601f}
  .bigbtn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(47,36,23,.08)}
  .rowbtns{display:flex;gap:10px;margin-top:14px}
  .rowbtns>*{flex:1}
  .mini{background:#fff;border-radius:18px;padding:14px;font-weight:900;font-size:15px;box-shadow:0 3px 0 rgba(47,36,23,.06);text-align:center}

  /* ── 퀴즈 ── */
  .qz{padding:10px 16px 30px;min-height:100vh;display:flex;flex-direction:column}
  .qbar{display:flex;align-items:center;gap:10px;padding:4px 0 10px}
  .qbar .pbar{flex:1;height:14px;border-radius:999px;background:#f1e3ce;overflow:hidden}
  .qbar .pbar i{display:block;height:100%;background:linear-gradient(90deg,#55cd9b,#33b07e);border-radius:999px;transition:width .3s ease}
  .qbar .num{font-weight:900;font-size:14px;color:var(--ink2);min-width:50px;text-align:right;white-space:nowrap;flex:0 0 auto;padding-right:2px}
  .qcard{background:#fff;border-radius:28px;padding:20px 18px;box-shadow:var(--shadow);margin-top:6px}
  .qtype{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:900;color:#8a6a3d;
    background:#fff5e3;border-radius:999px;padding:4px 11px;margin-bottom:10px}
  .ask{font-size:24px;font-weight:900;line-height:1.32;letter-spacing:-.7px;display:flex;gap:8px;align-items:flex-start}
  .ask .spk{flex:0 0 auto;width:46px;height:46px;border-radius:16px;background:#eef4ff;display:flex;align-items:center;justify-content:center;font-size:22px}
  .askEn{margin-top:8px;font-size:17px;font-weight:800;color:#4c6bb5;line-height:1.35}
  .askKo{margin-top:6px;font-size:14.5px;font-weight:700;color:var(--ink3)}
  .vis{margin:16px 0 4px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;min-height:64px}
  .blkrow{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:320px}
  .blkrow i{width:34px;height:34px;border-radius:9px;display:block;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
  .eq{font-size:40px;font-weight:900;letter-spacing:2px}
  .parts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:34px;font-weight:900}
  .parts span{background:#f5ecd9;border-radius:14px;padding:4px 12px;min-width:48px;text-align:center}
  .pic{font-size:78px;line-height:1}
  .speakerbig{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#7cc6ff,#5b8def);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:54px;box-shadow:0 8px 0 #3f6bc0}
  .opts{display:flex;flex-direction:column;gap:11px;margin-top:16px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:3px solid #f0e2cd;
    border-radius:22px;padding:15px 16px;font-size:24px;font-weight:900;letter-spacing:-.4px;min-height:74px;transition:transform .1s ease}
  .opt:active{transform:scale(.985)}
  .opt .idx{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#f7edda;color:#9a7b4e;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900}
  .opt .lbl{flex:1;min-width:0}
  .opt .lbl small{display:block;font-size:14px;font-weight:800;color:var(--ink3);margin-top:2px}
  .opt.right{border-color:#39b97c;background:#e9fbf2;animation:pulseOk .35s ease}
  .opt.wrong{border-color:#ff6b6b;background:#fff0f0;animation:shake .38s ease}
  .opt.dead{opacity:.45}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @keyframes pulseOk{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
  .fb{margin-top:14px;border-radius:20px;padding:14px 16px;font-size:17px;font-weight:900;display:none}
  .fb.show{display:block;animation:fadeUp .25s ease}
  .fb.good{background:#e9fbf2;color:#1d7a4e}
  .fb.hint{background:#fff6e5;color:#9a6b17}
  .fb.bad{background:#fff0f0;color:#b03a3a}
  .fb.ans{background:#eef4ff;color:#3b5cae}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .nextbtn{margin-top:14px;display:none;width:100%;background:#2f2417;color:#fff;border-radius:22px;padding:18px;
    font-size:20px;font-weight:900;box-shadow:0 5px 0 #17110a}
  .nextbtn.show{display:block}

  /* ── 결과 ── */
  .result{min-height:86vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px}
  .gemwin{font-size:96px;line-height:1;animation:gemIn .8s cubic-bezier(.2,1.5,.4,1)}
  @keyframes gemIn{0%{transform:scale(.2) rotate(-30deg);opacity:0}60%{transform:scale(1.15) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  .spark{position:absolute;font-size:26px;animation:sp 1.4s ease-out infinite}
  @keyframes sp{0%{transform:scale(.4);opacity:0}40%{opacity:1}100%{transform:scale(1.4);opacity:0}}
  .result h2{font-size:30px;font-weight:900;margin:14px 0 4px;letter-spacing:-1px}
  .result p{margin:0;font-size:17px;font-weight:800;color:var(--ink2)}
  .result .score{font-size:32px;font-weight:900;margin:12px 0 4px;line-height:1.25;width:100%}
  .result .btns{width:100%;margin-top:26px;display:flex;flex-direction:column;gap:10px}

  /* ── 사이트워드 ── */
  .swgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 0 30px}
  .swchip{background:#fff;border-radius:18px;padding:14px 6px;font-size:19px;font-weight:900;box-shadow:0 3px 0 rgba(47,36,23,.06);
    text-align:center;letter-spacing:.3px}
  .swchip.on{background:#ffe9c2;box-shadow:0 3px 0 #e8b45a}
  .swhead{display:flex;align-items:center;gap:12px;margin-top:12px}
  .swhead .word{font-size:52px;font-weight:900;letter-spacing:-1px}
  .swhead .ko{font-size:19px;font-weight:900;color:#a2682f}
  .swnote{font-size:14.5px;font-weight:700;color:var(--ink3);margin-top:2px}
  .swbtns{display:flex;gap:10px;margin:14px 0 6px}
  .swbtns button{flex:1;background:#fff;border-radius:18px;padding:15px;font-size:17px;font-weight:900;box-shadow:0 3px 0 rgba(47,36,23,.07)}
  .slist{margin-top:10px;display:flex;flex-direction:column;gap:9px;padding-bottom:30px}
  .sent{background:#fff;border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 2px 0 rgba(47,36,23,.05)}
  .sent .n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#f7edda;color:#9a7b4e;font-size:13px;font-weight:900;
    display:flex;align-items:center;justify-content:center;margin-top:2px}
  .sent .tx{flex:1;min-width:0}
  .sent .en{display:block;font-size:19px;font-weight:900;line-height:1.3}
  .sent .ko{display:block;font-size:14.5px;font-weight:700;color:var(--ink3);margin-top:3px}
  .sent .snd{flex:0 0 auto;width:40px;height:40px;border-radius:13px;background:#eef4ff;font-size:19px;display:flex;align-items:center;justify-content:center}
  .sent.on{background:#fff4dc;box-shadow:0 0 0 3px #ffd166 inset}

  .empty{padding:40px 10px;text-align:center;color:var(--ink3);font-weight:800}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#2f2417;color:#fff;
    border-radius:999px;padding:13px 22px;font-weight:900;font-size:17px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;
    transition:all .3s ease;z-index:60;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{text-align:center;font-size:12px;color:#b7a68c;padding:10px 0 26px;font-weight:700}
  @media (max-width:359px){ .card{min-height:146px} .card .ic{font-size:40px} .card .nm{font-size:19px} h1{font-size:26px} }
</style>
</head>

계세요."},{"en":"We can play now.","ko":"우리는 지금 놀 수 있어요."},{"en":"Go to bed now.","ko":"지금 자러 가요."}]},{"word":"fill","word_ko":"채우다","note":"","sentences":[{"en":"Fill the cup.","ko":"컵을 채워요."},{"en":"Fill the bag.","ko":"가방을 채워요."},{"en":"Fill the box.","ko":"상자를 채워요."},{"en":"Fill the bottle.","ko":"병을 채워요."},{"en":"Fill the bowl.","ko":"그릇을 채워요."},{"en":"Let's fill it.","ko":"그것을 채워 봐요."},{"en":"Please fill the glass.","ko":"유리잔을 채워 주세요."},{"en":"I will fill the tank.","ko":"나는 통을 채울 거예요."},{"en":"Fill this page.","ko":"이 페이지를 채워요."},{"en":"Can you fill it up?","ko":"그것을 가득 채울 수 있니?"}]},{"word":"long","word_ko":"긴, 오래된","note":"","sentences":[{"en":"It is a long road.","ko":"그것은 긴 길이에요."},{"en":"I have long hair.","ko":"나는 머리카락이 길어요."},{"en":"It is a long time.","ko":"오랜 시간이에요."},{"en":"We took a long walk.","ko":"우리는 오래 걸었어요."},{"en":"She has a long book.","ko":"그녀는 두꺼운 책을 가지고 있어요."},{"en":"It is a long day.","ko":"긴 하루예요."},{"en":"We have a long way.","ko":"우리는 갈 길이 멀어요."},{"en":"It was a long wait.","ko":"오래 기다렸어요."},{"en":"He has a long pen.","ko":"그는 긴 펜을 가지고 있어요."},{"en":"It is a long story.","ko":"그것은 긴 이야기예요."}]},{"word":"down","word_ko":"아래로, 내려가","note":"","sentences":[{"en":"Come down.","ko":"내려와요."},{"en":"Look down.","ko":"아래를 봐요."},{"en":"Sit down.","ko":"앉아요."},{"en":"Put it down.","ko":"그것을 내려놔요."},{"en":"It is down there.","ko":"그것은 저 아래에 있어요."},{"en":"Go down the stairs.","ko":"계단을 내려가요."},{"en":"The box is down.","ko":"상자가 아래에 있어요."},{"en":"Write it down.","ko":"그것을 적어요."},{"en":"Slow down.","ko":"천천히 해요."},{"en":"Don't put it down.","ko":"그것을 내려놓지 마요."}]},{"word":"day","word_ko":"날, 하루","note":"","sentences":[{"en":"It is a sunny day.","ko":"맑은 날이에요."},{"en":"Today is a good day.","ko":"오늘은 좋은 날이에요."},{"en":"I have a busy day.","ko":"나는 바쁜 하루를 보내요."},{"en":"It is a rainy day.","ko":"비 오는 날이에요."},{"en":"We have a fun day.","ko":"우리는 재미있는 하루를 보내요."},{"en":"It is a cold day.","ko":"추운 날이에요."},{"en":"We had a great day.","ko":"우리는 멋진 하루를 보냈어요."},{"en":"It is a holiday today.","ko":"오늘은 쉬는 날이에요."},{"en":"Have a nice day.","ko":"좋은 하루 보내요."},{"en":"It is a special day.","ko":"특별한 날이에요."}]},{"word":"did","word_ko":"했다","note":"","sentences":[{"en":"I did my homework.","ko":"나는 숙제를 했어요."},{"en":"She did a good job.","ko":"그녀는 잘했어요."},{"en":"We did our best.","ko":"우리는 최선을 다했어요."},{"en":"He did not come.","ko":"그는 오지 않았어요."},{"en":"Did you see it?","ko":"그것을 봤니?"},{"en":"Did you hear that?","ko":"그것을 들었니?"},{"en":"What did you do?","ko":"너는 무엇을 했니?"},{"en":"She did it.","ko":"그녀가 그것을 했어요."},{"en":"We did it together.","ko":"우리는 함께 했어요."},{"en":"Did he call you?","ko":"그가 너를 불렀니?"}]},{"word":"get","word_ko":"얻다, 가지러 가다, ~하게 되다","note":"","sentences":[{"en":"Get up.","ko":"일어나요."},{"en":"Get ready.","ko":"준비해요."},{"en":"Get a book.","ko":"책을 가져와요."},{"en":"Get in the car.","ko":"차에 타요."},{"en":"Get on the bus.","ko":"버스에 타요."},{"en":"Get some water.","ko":"물을 좀 가져와요."},{"en":"Get home.","ko":"집에 도착해요."},{"en":"Let's get started.","ko":"시작해요."},{"en":"Get well soon.","ko":"빨리 나아요."},{"en":"Can I get this?","ko":"이것을 가질 수 있니?"}]},{"word":"come","word_ko":"오다","note":"","sentences":[{"en":"Come here.","ko":"이리 와요."},{"en":"Come in.","ko":"들어와요."},{"en":"Come with me.","ko":"나와 함께 가요."},{"en":"Come on.","ko":"이리 와요(어서)."},{"en":"Come to school.","ko":"학교에 와요."},{"en":"Come and sit.","ko":"와서 앉아요."},{"en":"Come home.","ko":"집에 와요."},{"en":"Come early.","ko":"일찍 와요."},{"en":"Don't come late.","ko":"늦게 오지 마요."},{"en":"Come back.","ko":"다시 와요."}]},{"word":"made","word_ko":"만들었다","note":"","sentences":[{"en":"She made a cake.","ko":"그녀가 케이크를 만들었어요."},{"en":"He made a model.","ko":"그가 모형을 만들었어요."},{"en":"We made a poster.","ko":"우리는 포스터를 만들었어요."},{"en":"I made a mistake.","ko":"나는 실수했어요."},{"en":"She made dinner.","ko":"그녀가 저녁을 만들었어요."},{"en":"They made a snowman.","ko":"그들은 눈사람을 만들었어요."},{"en":"We made a plan.","ko":"우리는 계획을 세웠어요."},{"en":"He made this.","ko":"그가 이것을 만들었어요."},{"en":"I made it myself.","ko":"나는 혼자서 만들었어요."},{"en":"We made good memories.","ko":"우리는 좋은 추억을 만들었어요."}]},{"word":"may","word_ko":"~해도 된다 / ~일지도 모른다","note":"","sentences":[{"en":"May I come in?","ko":"들어와도 될까요?"},{"en":"May I sit here?","ko":"여기 앉아도 될까요?"},{"en":"May I have water?","ko":"물을 마셔도 될까요?"},{"en":"May I read now?","ko":"지금 읽어도 될까요?"},{"en":"May I play?","ko":"놀아도 될까요?"},{"en":"May I help you?","ko":"도와드려도 될까요?"},{"en":"May I open it?","ko":"그것을 열어도 될까요?"},{"en":"May I go out?","ko":"나가도 될까요?"},{"en":"It may rain.","ko":"비가 올지도 몰라요."},{"en":"She may come.","ko":"그녀가 올지도 몰라요."}]},{"word":"part","word_ko":"부분, 일부","note":"","sentences":[{"en":"This is a part.","ko":"이것은 한 부분이에요."},{"en":"It is a small part.","ko":"그것은 작은 부분이에요."},{"en":"This is an important part.","ko":"이것은 중요한 부분이에요."},{"en":"It is part of a book.","ko":"그것은 책의 일부예요."},{"en":"We are part of a team.","ko":"우리는 팀의 일원이에요."},{"en":"This is the best part.","ko":"이것이 가장 좋은 부분이에요."},{"en":"It is part of my plan.","ko":"그것은 내 계획의 일부예요."},{"en":"We took part in it.","ko":"우리는 그것에 참여했어요."},{"en":"This is one part.","ko":"이것은 한 부분이에요."},{"en":"It is a big part.","ko":"그것은 큰 부분이에요."}]}]}</script>
<script>
(function(){
  'use strict';
  var D = JSON.parse(document.getElementById('data').textContent);
  var SER = D.series, EPS = D.eps, Q = D.quiz, SW = D.sw;
  var byKey = {};
  SER.forEach(function(s){ byKey[s.key] = s; });

  /* ── 저장 ── */
  var K_SEEN = 'blocks.playground.seen.v1';
  var K_BEST = 'blocks.playground.learn.v1';
  var K_GEM  = 'blocks.playground.gems.v1';
  var K_VID  = 'blocks.playground.video.v1';
  function lsGet(k, d){ try{ var v = window.localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } }
  function lsSet(k, v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  var seen = new Set(lsGet(K_SEEN, []));
  var best = lsGet(K_BEST, {}) || {};
  var gems = lsGet(K_GEM, {}) || {};
  var vid  = lsGet(K_VID, {}) || {};
  if (!Object.keys(gems).length) {
    Object.keys(best).forEach(function(qid){ if (best[qid] > 0) gems[qid] = 1; });
  }
  function gemCount(){ return Object.keys(gems).length; }
  function seriesGems(key){
    var n = 0;
    (EPS[key] || []).forEach(function(e){ if (gems[e.qid]) n++; });
    return n;
  }
  function doneCount(key){
    var n = 0;
    (EPS[key] || []).forEach(function(e){ if (gems[e.qid] || seen.has(e.qid)) n++; });
    return n;
  }
  function saveSeen(){ lsSet(K_SEEN, Array.from(seen)); }
  function saveGems(){ lsSet(K_GEM, gems); }

  /* ── 소리 ── */
  var AC = null;
  function tone(freq, at, dur, type, vol){
    try{
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.value = 0; o.connect(g); g.connect(AC.destination);
      var t = AC.currentTime + at;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol || .16, t + .02);
      g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.start(t); o.stop(t + dur + .02);
    }catch(e){}
  }
  function sndGood(){ tone(660,0,.16); tone(880,.13,.2); }
  function sndBad(){ tone(220,0,.18,'triangle',.12); tone(180,.12,.22,'triangle',.1); }
  function sndGem(){ tone(660,0,.14); tone(880,.12,.14); tone(1180,.24,.3); }

  var voices = [];
  function loadVoices(){
    try{ voices = window.speechSynthesis.getVoices() || []; }catch(e){ voices = []; }
  }
  if ('speechSynthesis' in window) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
  function speak(text, lang, rate){
    if (!('speechSynthesis' in window) || !text) return;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = lang || 'en-US';
      u.rate = rate || .92;
      u.pitch = 1.05;
      var want = (lang || 'en-US').slice(0,2).toLowerCase();
      var v = voices.filter(function(x){ return (x.lang||'').toLowerCase().indexOf(want) === 0; })[0];
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ── 상태 ── */
  var st = { qi:0, tries:0, total:0, firstRight:0, answered:false, finished:false, reveal:false, dead:[], newGem:false, busy:false };
  var cur = { key:null, idx:0 };
  var app = document.getElementById('app');

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function gemTop(){
    return '<div class="gemtop" id="gemtop"><span class="g">💎</span><span class="gemn">' + gemCount() + '</span></div>';
  }
  function toast(msg){
    var el = document.getElementById('tst');
    if (!el) { el = document.createElement('div'); el.id = 'tst'; el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg;
    void el.offsetWidth; el.classList.add('on');
    clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('on'); }, 2200);
  }
  function bumpGem(){
    var els = document.querySelectorAll('.gemn');
    for (var i = 0; i < els.length; i++) els[i].textContent = gemCount();
    var el = document.getElementById('gemtop');
    if (el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  }
  function epAt(key, i){ return (EPS[key] || [])[i]; }
  function nextIndex(key){
    var arr = EPS[key] || [];
    for (var i = 0; i < arr.length; i++) { if (!gems[arr[i].qid] && !seen.has(arr[i].qid)) return i; }
    for (var j = 0; j < arr.length; j++) { if (!gems[arr[j].qid]) return j; }
    return 0;
  }
  function seriesColor(s){ return s.grad; }

  /* ── 홈 ── */
  function viewHome(){
    var cards = SER.map(function(s){
      var total = s.type === 'sw' ? SW.length : (EPS[s.key] || []).length;
      var done = s.type === 'sw' ? 0 : doneCount(s.key), g = s.type === 'sw' ? 0 : seriesGems(s.key);
      var pct = s.type === 'sw' ? 100 : (total ? Math.round(done / total * 100) : 0);
      return '<button class="card" data-go="' + (s.type === 'sw' ? '#/w' : '#/s/' + s.key) + '" style="background:' + s.grad + ';color:' + (s.ink || '#fff') + '">' +
        '<span class="deco"></span>' +
        '<span class="ic">' + s.icon + '</span>' +
        '<span><span class="nm">' + esc(s.name) + '</span>' +
        '<span class="sub">' + esc(s.sub) + '</span>' +
        '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
        '<span class="cnt">' + (s.type === 'sw' ? (total + '단어') : (done + ' / ' + total + '편')) + (g ? ' · 💎 ' + g : '') + '</span></span>' +
        '</button>';
    }).join('');
    return '<div class="wrap">' + gemTop() +
      '<div class="home-top"><div class="logo"><span class="blk"><i></i><i></i><i></i><i></i></span><h1>블록스 놀이터</h1></div>' +
      '<p class="tagline">보고, 듣고, 놀이로 배우는 수와 글자</p></div>' +
      '<div class="grid">' + cards + '</div>' +
      '<div class="foot">영상은 유튜브에서 재생돼요 · 학습 기록은 이 기기에만 저장돼요</div>' +
      '</div>';
  }

  /* ── 시리즈 ── */
  function viewSeries(key){
    var s = byKey[key]; if (!s) return viewHome();
    var arr = EPS[key] || [];
    if (s.type === 'sw') return viewSightWords();
    var ni = nextIndex(key), total = arr.length, done = doneCount(key), g = seriesGems(key);
    var hero = '';
    if (arr[ni]) {
      var e = arr[ni];
      hero = '<div class="hero" style="background:' + s.grad + '">' +
        '<span class="deco2">' + s.icon + '</span>' +
        '<div class="k">' + (g >= total ? '🎉 모두 봤어요! 다시 봐도 좋아요' : '다음에 볼 회차') + '</div>' +
        '<div class="t">' + (e.no || (ni + 1)) + '번 · ' + esc(e.title) + (e.title2 ? '<span style="display:block;font-size:14px;font-weight:800;opacity:.9;margin-top:4px">' + esc(e.title2) + '</span>' : '') + '</div>' +
        '<button class="go" data-go="#/p/' + key + '/' + ni + '">▶ 이어서 보기</button></div>';
    }
    var list = arr.map(function(e, i){
      var cls = gems[e.qid] ? 'done' : (i === ni ? 'next' : '');
      var mark = gems[e.qid] ? '💎' : (e.no || (i + 1));
      return '<div class="step ' + cls + '"><span class="line"></span>' +
        '<button class="dot" data-go="#/p/' + key + '/' + i + '">' + mark + '</button>' +
        '<button class="body" data-go="#/p/' + key + '/' + i + '"><span class="txt">' +
        '<b>' + esc(e.title) + (i === ni ? '<span class="badge-now">여기!</span>' : '') + '</b>' +
        '<small>' + esc([e.se, e.dur, e.title2].filter(Boolean).join(' · ')) + '</small></span>' +
        '<span class="nq">' + ((Q[e.q || e.qid] || []).length) + '문제</span></button></div>';
    }).join('');
    return '<div class="topbar"><div class="wrap"><div class="row">' +
      '<button class="back" data-go="#/" aria-label="뒤로">←</button>' +
      '<div class="ttl"><b>' + esc(s.name) + '</b><span>' + esc(s.sub) + '</span></div>' +
      '<span class="pill">💎 <span class="gemn">' + g + '</span></span></div></div></div>' +
      '<div class="wrap"><div style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;font-weight:900;color:#a08c72">' +
      '<span>' + done + ' / ' + total + '편 봤어요</span>' +
      '<span style="flex:1;height:10px;border-radius:999px;background:#f1e3ce;overflow:hidden"><i style="display:block;height:100%;border-radius:999px;background:' +
      (s.dot || '#ffb020') + ';width:' + Math.round(done / total * 100) + '%"></i></span></div>' +
      hero + '<div class="pathlist">' + list + '</div></div>';
  }

  /* ── 플레이어 ── */
  function viewPlayer(key, i){
    var s = byKey[key], e = epAt(key, i);
    if (!s || !e) return viewHome();
    var started = !!vid[e.qid];
    var player = started
      ? '<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/' + e.vid + '?autoplay=1&rel=0&playsinline=1&modestbranding=1" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>'
      : '<div class="video">' +
        '<button class="poster" id="startv" data-vid="' + e.vid + '" style="background:' + s.grad + '">' +
        '<span class="play">▶</span><b>영상 보기</b></button></div>';
    var learn = e.learn ? '<div class="learnbox"><div class="lt">이 편에서 배우는 것</div>' + esc(e.learn) + (e.detail ? '<div style="margin-top:6px;color:#8a7458;font-size:14.5px">' + esc(e.detail) + '</div>' : '') + '</div>' : '';
    var desc = e.desc ? '<div class="learnbox" style="background:#f7f2ea"><div class="lt">이야기</div>' +
      '<div class="descbox" id="dbox"><span style="font-size:14.5px;color:#6d5c47">' + esc(e.desc) + '</span></div>' +
      '<button class="morebtn" id="dmore">더 보기 ▾</button></div>' : '';
    var nq = (Q[e.q] || []).length;
    return '<div class="topbar"><div class="wrap"><div class="row">' +
      '<button class="back" data-go="#/s/' + key + '" aria-label="뒤로">←</button>' +
      '<div class="ttl"><b>' + esc(s.name) + '</b><span>' + esc(e.se || '') + (e.dur ? ' · ' + e.dur : '') + '</span></div>' +
      '<span class="pill">💎 <span class="gemn">' + gemCount() + '</span></span></div></div></div>' +
      '<div class="wrap player">' + player +
      '<div class="ephead"><h2>' + (e.no || (i + 1)) + '번 · ' + esc(e.title) + '</h2>' +
      '<div class="meta">' + esc([e.title2, e.dur].filter(Boolean).join(' · ')) + '</div></div>' +
      learn + desc +
      '<button class="bigbtn" data-go="#/q/' + key + '/' + i + '">' + (gems[e.qid] ? '💎 학습활동 다시 풀기' : '✏️ 학습활동 ' + nq + '문제') + '</button>' +
      '<div class="rowbtns">' +
      (i > 0 ? '<button class="mini" data-go="#/p/' + key + '/' + (i - 1) + '">← 이전 회차</button>' : '') +
      (i < (EPS[key] || []).length - 1 ? '<button class="mini" data-go="#/p/' + key + '/' + (i + 1) + '">다음 회차 →</button>' : '') +
      '</div>' +
      '<div class="foot">영상은 유튜브에서 재생돼요</div></div>';
  }

  /* ── 퀴즈 ── */
  function blockColors(n){
    var pal = ['#ff5a5f','#ffb020','#3ec1a0','#5b8def','#a259ff','#ff7ab6'];
    var out = '';
    for (var i = 0; i < n; i++) out += '<i style="background:' + pal[i % pal.length] + '"></i>';
    return out;
  }
  function qTypeLabel(q){
    return q.askEn ? '영어' : (q.t === 'say' ? '듣기' : q.t === 'build' ? '글자 조립' : q.t === 'pic' ? '그림' :
      q.t === 'count' ? '세기' : q.t === 'calc' ? '계산' : q.t === 'cmp' ? '크기 비교' : q.t === 'next' ? '다음 수' : '생각하기');
  }
  function qVisual(q, qid){
    if (q.t === 'count') return '<div class="blkrow">' + blockColors(q.blocks || 1) + '</div>';
    if (q.t === 'calc') return '<div class="eq">' + esc(q.calc || '') + ' = ?</div>';
    if (q.t === 'build') return '<div class="parts">' + (q.parts || []).map(function(p){ return '<span>' + esc(p) + '</span>'; }).join('<em style="font-style:normal;font-size:22px">+</em>') + '</div>';
    if (q.t === 'pic') return '<div class="pic">' + esc(q.emoji || '') + '</div>';
    if (q.t === 'say') return '<button class="speakerbig" data-say="' + esc(q.say) + '" aria-label="다시 듣기">🔊</button>';
    return '';
  }
  function viewQuiz(key, i){
    var s = byKey[key], e = epAt(key, i), qs = Q[e.q] || [];
    if (!qs.length) return viewPlayer(key, i);
    if (st.finished) return viewResult(key, i);
    var q = qs[st.qi];
    var opts = q.opts.map(function(o, k){
      var ko = q.optsKo && q.optsKo[k] ? '<small>' + esc(q.optsKo[k]) + '</small>' : '';
      var cls = 'opt';
      if (st.reveal || st.tries >= 2) {
        if (k === q.a) cls += ' right';
        else if (st.dead.indexOf(k) >= 0) cls += ' wrong dead';
      } else if (st.dead.indexOf(k) >= 0) cls += ' dead';
      return '<button class="' + cls + '" data-pick="' + k + '"' + ((st.dead.indexOf(k) >= 0 || st.reveal) ? ' disabled' : '') + '>' +
        '<span class="idx">' + (k + 1) + '</span><span class="lbl">' + esc(o) + ko + '</span></button>';
    }).join('');
    var fb = '';
    if (st.tries === 1 && !st.reveal) fb = '<div class="fb hint show">아차! <b>한 번 더</b> 생각해 볼까요? 💪</div>';
    else if (st.reveal) {
      fb = '<div class="fb ' + (st.tries === 0 ? 'good' : 'ans') + ' show">' +
        (st.tries === 0 ? '정답이야! 🎉 ' : '이게 정답이에요! ') + esc(q.why || '') + '</div>';
    }
    var showNext = st.reveal;
    var askKo = q.askEn ? '<div class="askEn">' + esc(q.askEn) + '</div><div class="askKo">' + esc(q.ask) + '</div>'
      : '<div class="ask"><span>' + esc(q.ask) + '</span><button class="spk" data-read="' + esc(q.ask) + '" data-lang="ko-KR" aria-label="읽어 주기">🔊</button></div>';
    var extraSpk = q.askEn ? '<button class="mini" style="margin-top:10px" data-read="' + esc(q.askEn + '. ' + q.opts.join(', ')) + '" data-lang="en-US">🔊 영어로 듣기</button>' : '';
    return '<div class="wrap qz">' +
      '<div class="qbar"><button class="back" data-go="#/p/' + key + '/' + i + '">←</button>' +
      '<span class="pbar"><i style="width:' + Math.round((st.qi + 1) / qs.length * 100) + '%"></i></span>' +
      '<span class="num">' + (st.qi + 1) + ' / ' + qs.length + '</span></div>' +
      '<div class="qcard"><span class="qtype">' + qTypeLabel(q) + '</span>' + askKo + extraSpk +
      '<div class="vis">' + qVisual(q, e.qid) + '</div>' +
      '<div class="opts">' + opts + '</div>' + fb +
      '<button class="nextbtn ' + (showNext ? 'show' : '') + '" id="nextq">' + (st.qi + 1 === qs.length ? '결과 보기 🎉' : '다음 문제 →') + '</button>' +
      '</div></div>';
  }

  function viewResult(key, i){
    var s = byKey[key], e = epAt(key, i), qs = Q[e.q] || [];
    var gotGem = !!st.newGem;
    var nxt = i + 1 < (EPS[key] || []).length ? i + 1 : -1;
    return '<div class="wrap result">' +
      '<div style="position:relative">' + (gotGem ? '<div class="gemwin">💎</div><span class="spark" style="left:-52px;top:6px">✨</span><span class="spark" style="right:-54px;top:22px;animation-delay:.3s">✨</span><span class="spark" style="left:-26px;bottom:-4px;animation-delay:.6s">⭐</span><span class="spark" style="right:-30px;bottom:2px;animation-delay:.9s">✨</span>' : '<div class="gemwin">🌟</div>') + '</div>' +
      '<h2>' + (gotGem ? '보석을 얻었어요!' : '학습활동 끝!') + '</h2>' +
      '<div class="score">' + st.total + '문제 중 ' + st.firstRight + '개 맞혔어요</div>' +
      '<p>' + (st.newGem ? '영상 보고 학습까지, 보석 하나 획득!' : (gems[e.qid] ? '이미 받은 보석이에요. 다시 봐도 좋아요!' : '영상을 먼저 보면 보석을 받을 수 있어요')) + '</p>' +
      '<div class="btns">' +
      (!gotGem && !gems[e.qid] ? '<button class="bigbtn" data-go="#/p/' + key + '/' + i + '">▶ 영상 보고 보석 받기</button>' : '') +
      (nxt >= 0 ? '<button class="bigbtn' + (gotGem || gems[e.qid] ? '' : ' ghost') + '" data-go="#/p/' + key + '/' + nxt + '">다음 회차 보기 →</button>' : '') +
      '<button class="bigbtn ghost" data-go="#/s/' + key + '">' + esc(s.name) + ' 목록</button>' +
      '<button class="mini" data-go="#/">🏠 처음으로</button></div></div>';
  }

  function finishQuiz(){
    var key = cur.key, i = cur.idx, e = epAt(key, i);
    var qs = Q[e.q] || [];
    var correct = st.qi; // 맞힌 문제 수(첫 시도 기준 아님)
    var prev = best[e.qid] || 0;
    if (st.firstRight > prev || !(e.qid in best)) { best[e.qid] = Math.max(prev, st.firstRight); lsSet(K_BEST, best); }
    st.newGem = false;
    if (vid[e.qid] && !gems[e.qid]) { gems[e.qid] = 1; saveGems(); st.newGem = true; sndGem(); }
    if (!gems[e.qid] && !vid[e.qid]) {
      /* 영상을 아직 안 봤어도 학습은 기록 */
      sndGood();
    }
    st.finished = true;
    render();
    bumpGem();
  }

  /* ── 사이트워드 ── */
  function viewSightWords(){
    var chips = SW.map(function(w, i){
      return '<button class="swchip" data-go="#/w/' + i + '">' + esc(w.word) + '</button>';
    }).join('');
    return '<div class="topbar"><div class="wrap"><div class="row">' +
      '<button class="back" data-go="#/" aria-label="뒤로">←</button>' +
      '<div class="ttl"><b>사이트워드 100</b><span>자주 나오는 영어 단어 100개</span></div>' +
      '<span class="pill">💎 <span class="gemn">' + gemCount() + '</span></span></div></div></div>' +
      '<div class="wrap"><div class="swgrid">' + chips + '</div></div>';
  }
  function viewWord(i){
    var w = SW[i]; if (!w) return viewSightWords();
    var sents = (w.sentences || []).map(function(x, k){
      return '<div class="sent" data-si="' + k + '"><span class="n">' + (k + 1) + '</span><span class="tx">' +
        '<span class="en">' + esc(x.en) + '</span><span class="ko">' + esc(x.ko) + '</span></span>' +
        '<button class="snd" data-read="' + esc(x.en) + '" data-lang="en-US">🔊</button></div>';
    }).join('');
    return '<div class="topbar"><div class="wrap"><div class="row">' +
      '<button class="back" data-go="#/w" aria-label="뒤로">←</button>' +
      '<div class="ttl"><b>사이트워드 100</b><span>' + (i + 1) + ' / ' + SW.length + '</span></div>' +
      '<span class="pill">💎 <span class="gemn">' + gemCount() + '</span></span></div></div></div>' +
      '<div class="wrap"><div class="swhead"><span class="word">' + esc(w.word) + '</span>' +
      '<span class="ko">' + esc(w.word_ko) + '</span></div>' +
      '<div class="swnote">' + esc(w.note || '') + '</div>' +
      '<div class="swbtns"><button data-read="' + esc(w.word) + '" data-lang="en-US">🔊 보통</button>' +
      '<button data-read="' + esc(w.word) + '" data-lang="en-US" data-rate="0.55">🐢 천천히</button></div>' +
      '<button class="mini" style="width:100%" data-playall="' + i + '">🔁 문장 10개 이어 듣기</button>' +
      '<div class="slist">' + sents + '</div>' +
      '<div class="rowbtns" style="margin-bottom:26px">' +
      (i > 0 ? '<button class="mini" data-go="#/w/' + (i - 1) + '">← 이전 단어</button>' : '') +
      (i < SW.length - 1 ? '<button class="mini" data-go="#/w/' + (i + 1) + '">다음 단어 →</button>' : '') +
      '</div></div>';
  }

  /* ── 문장 이어 듣기 ── */
  var swStop = false;
  function stopSpeech(){ swStop = true; try{ window.speechSynthesis.cancel(); }catch(e){} }
  function playAll(i){
    var w = SW[i]; if (!w) return;
    var list = (w.sentences || []).slice();
    swStop = false;
    var k = 0;
    function mark(n, on){ var el = document.querySelector('.sent[data-si="' + n + '"]'); if (el) el.classList.toggle('on', !!on); }
    function done(){ for (var n = 0; n < list.length; n++) mark(n, false); }
    function step(){
      if (swStop || k >= list.length) { done(); return; }
      mark(k - 1, false); mark(k, true);
      var advanced = false;
      function next(){ if (advanced) return; advanced = true; if (swStop) return; k++; setTimeout(step, 420); }
      try{
        var u = new SpeechSynthesisUtterance(list[k].en);
        u.lang = 'en-US'; u.rate = .84;
        var v = voices.filter(function(x){ return (x.lang||'').toLowerCase().indexOf('en') === 0; })[0];
        if (v) u.voice = v;
        u.onend = next; u.onerror = next;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
        setTimeout(function(){ if (!advanced) next(); }, Math.max(1800, list[k].en.length * 80));
      }catch(e){ setTimeout(function(){ if (!advanced) next(); }, 1400); }
    }
    step();
  }

  /* ── 라우터 ── */
  function render(){
    stopSpeech();
    var h = location.hash || '#/';
    var m;
    if ((m = h.match(/^#\/s\/([\w-]+)/))) {
      cur.key = m[1]; app.innerHTML = viewSeries(m[1]);
    } else if ((m = h.match(/^#\/p\/([\w-]+)\/(\d+)/))) {
      cur.key = m[1]; cur.idx = +m[2];
      app.innerHTML = viewPlayer(m[1], +m[2]);
    } else if ((m = h.match(/^#\/q\/([\w-]+)\/(\d+)/))) {
      cur.key = m[1]; cur.idx = +m[2];
      var nk = m[1] + '/' + m[2];
      if (st.qkey !== nk) { st = { qi:0, tries:0, total:(Q[epAt(m[1],+m[2]).q || epAt(m[1],+m[2]).qid] || []).length, firstRight:0, answered:false, finished:false, reveal:false, dead:[], newGem:false, busy:false, qkey:nk }; }
      app.innerHTML = viewQuiz(m[1], +m[2]);
      if (!st.finished && st.tries === 0 && !st.reveal) {
        var q = (Q[epAt(m[1], +m[2]).q || epAt(m[1],+m[2]).qid] || [])[st.qi];
        if (q && q.t === 'say') setTimeout(function(){ speak(q.say, 'en-US', .85); }, 320);
      }
    } else if ((m = h.match(/^#\/w\/(\d+)/))) {
      app.innerHTML = viewWord(+m[1]);
    } else if (h === '#/w') {
      app.innerHTML = viewSightWords();
    } else {
      app.innerHTML = viewHome();
    }
    window.scrollTo(0, 0);
  }

  /* ── 이벤트 ── */
  document.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-go]');
    if (t) {
      var to = t.getAttribute('data-go');
      if (location.hash === to) {
        if (/^#\/q\//.test(to)) { st.qkey = null; }
        render();
      } else {
        location.hash = to;
      }
      return;
    }

    var sv = ev.target.closest('#startv');
    if (sv) {
      var e = epAt(cur.key, cur.idx);
      seen.add(e.qid); saveSeen();
      vid[e.qid] = 1; lsSet(K_VID, vid);
      if ((e.qid in best) && !gems[e.qid]) { gems[e.qid] = 1; saveGems(); sndGem(); bumpGem(); toast('💎 보석을 얻었어요!'); }
      sv.outerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + sv.getAttribute('data-vid') +
        '?autoplay=1&rel=0&playsinline=1&modestbranding=1" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
      return;
    }

    var rd = ev.target.closest('[data-read]');
    if (rd) {
      speak(rd.getAttribute('data-read'), rd.getAttribute('data-lang') || 'en-US', parseFloat(rd.getAttribute('data-rate') || '.92'));
      return;
    }
    var dm = ev.target.closest('#dmore');
    if (dm) {
      var box = document.getElementById('dbox');
      if (box) { var open = box.classList.toggle('open'); dm.textContent = open ? '접기 ▴' : '더 보기 ▾'; }
      return;
    }
    var pa = ev.target.closest('[data-playall]');
    if (pa) { playAll(+pa.getAttribute('data-playall')); return; }
    var sy = ev.target.closest('[data-say]');
    if (sy) { speak(sy.getAttribute('data-say'), 'en-US', .82); return; }

    var pick = ev.target.closest('[data-pick]');
    if (pick && !pick.disabled) {
      var k = +pick.getAttribute('data-pick');
      var qs = Q[epAt(cur.key, cur.idx).q || epAt(cur.key,cur.idx).qid] || [];
      var q = qs[st.qi];
      st.answered = true;
      if (k === q.a) {
        if (st.tries === 0) { st.firstRight++; sndGood(); } else sndGood();
        st.reveal = true;
        render();
        st.autoT = setTimeout(function(){ advance(); }, 1150);
      } else {
        st.tries++;
        st.dead.push(k);
        sndBad();
        if (st.tries >= 2) { st.reveal = true; }
        render();
      }
      return;
    }

    var nx = ev.target.closest('#nextq');
    if (nx) { advance(); return; }
  });

  function advance(){
    if (st.autoT) { clearTimeout(st.autoT); st.autoT = null; }
    if (st.busy) return; st.busy = true; setTimeout(function(){ st.busy = false; }, 260);
    var qs = Q[epAt(cur.key, cur.idx).q || epAt(cur.key,cur.idx).qid] || [];
    if (st.qi + 1 < qs.length) {
      st.qi++; st.tries = 0; st.reveal = false; st.dead = []; st.answered = false;
      render();
      var q = qs[st.qi];
      if (q && q.t === 'say') setTimeout(function(){ speak(q.say, 'en-US', .85); }, 320);
    } else {
      finishQuiz();
    }
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
