<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4f1ff">
<title>놀이터 기기 관리 · 유니혀니</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    color:#332e47;font-size:16px;line-height:1.55;
    font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(165deg,#f6f3ff 0%,#fff4f8 55%,#eefbf4 100%) fixed;
    -webkit-text-size-adjust:100%;
  }
  header{padding:20px 18px 10px;max-width:560px;margin:0 auto}
  h1{font-size:21px;margin:0 0 6px;letter-spacing:-.3px}
  .sub{font-size:13.5px;color:#7a7392;margin:0}
  main{max-width:560px;margin:0 auto;padding:6px 18px 40px}
  .card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 14px 34px rgba(96,79,150,.12);text-align:center}
  .card h2{font-size:18px;margin:6px 0 8px}
  .card p{font-size:14.5px;color:#6f6889;margin:0 0 16px;word-break:keep-all}
  .btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 18px;cursor:pointer;width:100%;
    background:linear-gradient(135deg,#8c6cf0,#e06fa8);color:#fff;box-shadow:0 8px 18px rgba(140,108,240,.26)}
  .btn.ghost{background:#fff;color:#5b3fb0;border:1.5px solid #e3def5;box-shadow:none}
  .btn[disabled]{opacity:.55;cursor:default}
  .spin{width:34px;height:34px;margin:8px auto 14px;border-radius:50%;border:3px solid #ece5ff;border-top-color:#8c6cf0;animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .who{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px;font-size:13px;color:#7a7392}
  .who button{font:inherit;font-size:12.5px;background:none;border:0;color:#8c6cf0;text-decoration:underline;cursor:pointer;padding:4px}
  .counts{display:flex;gap:8px;margin:0 0 14px;font-size:13px;flex-wrap:wrap}
  .counts span{background:#fff;border-radius:999px;padding:6px 12px;box-shadow:0 4px 12px rgba(96,79,150,.08)}
  .counts b{font-weight:800}
  .dev{background:#fff;border-radius:20px;padding:16px 16px 14px;margin:0 0 12px;box-shadow:0 10px 26px rgba(96,79,150,.1)}
  .dev .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .dev .nm{font-size:16.5px;font-weight:800;letter-spacing:-.2px;word-break:break-all}
  .chip{font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 10px}
  .chip.pending{background:#fff6d8;color:#8a6f19}
  .chip.approved{background:#e6f8ee;color:#1f7a4d}
  .chip.blocked{background:#ffe9ef;color:#a8324b}
  .meta{font-size:12.5px;color:#8d87a3;margin-top:7px;line-height:1.6}
  .meta code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#5b3fb0;background:#f4efff;border-radius:7px;padding:2px 7px;letter-spacing:1px}
  .acts{display:flex;gap:8px;margin-top:12px}
  .acts button{flex:1;font:inherit;font-size:14px;font-weight:700;border-radius:12px;padding:11px 6px;cursor:pointer;border:1.5px solid #e3def5;background:#fff;color:#5b3fb0}
  .acts .ok{background:#1f9d63;border-color:#1f9d63;color:#fff}
  .acts .no{background:#fff;border-color:#f2b7c6;color:#b03553}
  .acts .del{background:#fbfaff;border-color:#ece8f7;color:#9a93b0}
  .empty{background:#fff;border-radius:20px;padding:26px 20px;text-align:center;color:#8d87a3;font-size:14.5px;box-shadow:0 10px 26px rgba(96,79,150,.08)}
  .help{margin-top:18px;font-size:12.5px;color:#8d87a3;line-height:1.7;word-break:keep-all}
  .err{background:#fff3f5;color:#a8324b;border-radius:14px;padding:12px 14px;font-size:13.5px;margin-top:12px}
  .hide{display:none!important}
  ul.rec{margin:8px 0 0;padding-left:18px;font-size:13px;color:#7a7392}
</style>
</head>
<body>
<header>
  <h1>🔐 놀이터 기기 관리</h1>
  <p class="sub">승인한 기기에서만 아이들 놀이터가 열립니다.</p>
</header>
<main>
  <div id="view"></div>
</main>
<script src="admin.js?v=6"></script>
</body>
</html>
